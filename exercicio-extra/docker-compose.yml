 services:
  # 2. SERVIÇO DE BANCO DE DADOS (DB)
  db:
    image: postgres:15-alpine
    restart: always 
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
    # Configuração de Volume Nomeado para Persistência
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
    # Adiciona Healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. SERVIÇO DE INTERFACE DE ADMINISTRAÇÃO (Adminer)
  adminer:
    image: adminer:latest
    restart: always
    ports:
      # Expondo na porta 8080 do host
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db # Conecta-se ao hostname do serviço 'db'

  # 1. SERVIÇO DE API (BACKEND)
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      
    ports:
      # Puxa a porta do .env (ex: 3000:3000)
      - "${API_PORT}:${API_PORT}"
      
    # Conecta-se ao DB usando variáveis do .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      
    # Mapeamento de volume para DEV (Permite Hot Reload do código)
    volumes:
      - ./api/src:/usr/src/app/src # Mapeia apenas a pasta de código-fonte
      - ./api/package.json:/usr/src/app/package.json # Mapeia o package.json
      - /usr/src/app/node_modules # Garante que node_modules interno não seja sobrescrito
      
    # Depende do DB estar realmente pronto
    depends_on:
      db:
        condition: service_healthy
        
volumes:
  postgres_data: